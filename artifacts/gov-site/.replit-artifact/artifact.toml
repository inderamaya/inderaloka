kind = "web"
previewPath = "/"
title = "Government Portal"
version = "1.0.0"
id = "artifacts/gov-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18436

[services.development]
run = "pnpm --filter @workspace/gov-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gov-site", "run", "build" ]
publicDir = "artifacts/gov-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18436"
BASE_PATH = "/"
